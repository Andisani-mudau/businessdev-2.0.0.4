# Disable development features
vaadin.production-mode=true
vaadin.launch-browser=false
vaadin.allowed-packages=com.vaadin,org.vaadin,com.businessdev.application
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Server Configuration
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,application/font-woff,application/font-woff2
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logging Configuration
logging.level.root=WARN
logging.level.com.businessdev=INFO
logging.level.org.springframework=WARN
logging.level.org.atmosphere=WARN
logging.level.com.vaadin=INFO
logging.level.com.vaadin.flow.server=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/businessdev.log}
logging.file.max-size=10MB
logging.file.max-history=30

# Performance Optimizations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.main.allow-bean-definition-overriding=false
spring.mustache.check-template-location=false

# Cache settings
spring.resources.cache.period=31536000
spring.resources.chain.strategy.content.enabled=true
spring.resources.chain.strategy.content.paths=/**
spring.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/

# MongoDB Configuration (Production)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/businessdev}
spring.data.mongodb.auto-index-creation=true

# Security Configuration
# Note: Spring Security is enabled but authentication is not required
# All endpoints are publicly accessible (configured in SecurityConfig)
spring.security.enabled=true
vaadin.urlMapping=/*

# External Service Configuration (from environment variables)
currency.api.key=${CURRENCY_API_KEY}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=${BREVO_SENDER_NAME}
google.calendar.id=${GOOGLE_CALENDAR_ID}
google.calendar.credentials.file=${GOOGLE_CALENDAR_CREDENTIALS_FILE}
google.calendar.application.name=businessdev calendar api
app.default.timezone=${APP_TIMEZONE:Africa/Johannesburg}
business.hours.start=${BUSINESS_HOURS_START:9}
business.hours.end=${BUSINESS_HOURS_END:17}

# Actuator Configuration (Health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.mongo.enabled=true 
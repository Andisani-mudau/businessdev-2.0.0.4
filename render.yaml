services:
  - type: web
    name: businessdev
    env: java
    buildCommand: ./mvnw clean package -Pproduction
    startCommand: java -Dvaadin.productionMode=true -jar target/businessdev-1.0-SNAPSHOT.jar --spring.profiles.active=prod
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: 8080
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m -XX:+UseG1GC
      # REQUIRED: MongoDB connection string
      # - key: MONGODB_URI
      #   value: mongodb+srv://username:password@cluster.mongodb.net/businessdev?retryWrites=true&w=majority
      #   sync: false  # Set this in Render dashboard, not here (for security)
      # - key: CURRENCY_API_KEY
      #   value: your-api-key
      # - key: BREVO_API_KEY
      #   value: your-brevo-key
      # etc.

